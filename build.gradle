plugins {
	id 'fabric-loom' version '1.4.5'
	id 'ploceus' version '1.4.2'
}

version = "${project.property('mod.version')}+1.12.2"
group = project.property('mod.group')
base {
	archivesName = project.property('mod.id')
}

repositories {
	maven { name = 'Ornithe Releases'; url = 'https://maven.ornithemc.net/releases' }
	// The JSON parser OSL's config module uses.
	exclusiveContent {
		forRepository { maven { name = 'Quilt'; url = 'https://maven.quiltmc.org/repository/release' } }
		filter { includeGroup 'org.quiltmc.parsers' }
	}
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// The names Litematica and MaLiLib for Ornithe 1.12.2 are written against.
	mappings loom.layered {
		addLayer ploceus.mcpMappings('stable', '1.12', '39')
	}
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	// All of Ornithe's standard libraries, as OSL 0.11.3 (which Litematica and MaLiLib are built with) bundles them, so
	// the development client runs other Ornithe mods too (Mod Menu needs keybinds). ploceus.dependOsl no longer
	// resolves these gen1 modules, so they are named here. Branding 0.2.3 has no 1.12.2 build, and the entrypoint of
	// 0.3.0 names a class it lacks.
	for (module in [
		'branding:0.3.2+mc16w05b-mc1.12.2',
		'config:0.4.2+mc15w40a-mc1.12.2',
		'core:0.5.0',
		'entrypoints:0.4.2+mc13w16a-04192037-mc1.14.4',
		'keybinds:0.1.2+mc17w16a-mc1.12.2',
		'lifecycle-events:0.5.2+mc13w36a-09051446-mc1.13',
		'networking:0.6.4+mc14w31a-mc1.13-pre2',
		'resource-loader:0.2.8+mc13w26a-mc1.12.2'
	]) {
		modLocalRuntime "net.ornithemc.osl:${module}"
	}

	modImplementation "maven.modrinth:litematica:${project.property('deps.litematica')}"
	modImplementation "maven.modrinth:malilib:${project.property('deps.malilib')}"
	// OptiFine (loaded through Legacy OptiFabric) is not a build dependency: the mixins into its classes name them as
	// strings, and the rest of the mod only reaches it through mixins. Legacy OptiFabric does not run in the
	// development environment.
}

processResources {
	def props = [
		'id'     : project.property('mod.id'),
		'name'   : project.property('mod.name'),
		'version': project.version
	]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

loom {
	runs {
		client {
			// Logs every class a mixin is applied to, so a dev run shows ours applied.
			vmArg '-Dmixin.debug.verbose=true'
			// Legacy OptiFabric (with OptiFine, in run/mods) builds OptiFine's classes against vanilla Minecraft, and does
			// not find the vanilla jar where this Loom keeps it. Even so OptiFine does not fully work here: OptiFabric
			// leaves the inherited methods of the classes OptiFine patches unrenamed in development (IntegratedServer's
			// tick stays C), and Litematica's mixin into it fails. Test with OptiFine in a real Ornithe instance.
			vmArg "-Doptifabric.mc-jar=${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar"
		}
	}
}
